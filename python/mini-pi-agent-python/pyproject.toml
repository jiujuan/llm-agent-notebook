[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pi-agent"
version = "0.1.0"
description = "A dependency-free Python teaching implementation inspired by pi-agent-core"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

